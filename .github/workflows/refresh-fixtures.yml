name: Refresh daily football fixtures
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-daily-football-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch team index and upcoming fixtures
        run: python3 refresh_fixtures.py
      - name: Save daily data cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures-today.json data/fixtures-window.json
          git diff --cached --quiet || git commit -m 'Refresh daily teams and upcoming fixtures'
          git pushname: Refresh daily football fixtures
